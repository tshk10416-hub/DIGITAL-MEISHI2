<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Identity</title>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- ベース配色 --- */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --accent-color: #00d2ff;
            --accent-sub: #3a7bd5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Oxanium', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: 
                linear-gradient(rgba(58, 123, 213, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(58, 123, 213, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* --- カードデザイン --- */
        .card-container {
            position: relative;
            width: 90%;
            max-width: 380px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 
                0 15px 40px rgba(0, 50, 100, 0.1),
                0 0 0 1px rgba(255, 255, 255, 0.8) inset;
            padding: 50px 30px;
            text-align: center;
            opacity: 0; 
            transition: opacity 0.5s ease;
            backdrop-filter: blur(10px);
            border: 1px solid #d1d9e6;
            overflow: hidden;
        }

        /* --- 装飾 --- */
        .corner-deco {
            position: absolute;
            width: 15px;
            height: 15px;
            border: 3px solid var(--accent-color);
            transition: 0.3s;
            opacity: 0.7;
        }
        .top-left { top: 15px; left: 15px; border-right: none; border-bottom: none; }
        .top-right { top: 15px; right: 15px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 15px; left: 15px; border-right: none; border-top: none; }
        .bottom-right { bottom: 15px; right: 15px; border-left: none; border-top: none; }

        /* --- プロフィール画像 --- */
       .profile-wrapper { 
            position: relative; 
            width: 110px; 
            height: 110px; 
            margin: 15px auto 45px auto;
            /* ★ここから追加（中央揃えを強制する魔法のコード）★ */
            display: flex;
            justify-content: center;
            align-items: center;
            /* ★ここまで追加★ */
        }

      .profile-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 3px solid white; 
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2); 
            z-index: 2; 
            position: relative;
            box-sizing: border-box; /* 白い枠線を含めて円の中心に収める */
        }

        .spin-ring {
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border-radius: 50%;
            border: 2px dashed var(--accent-sub);
            animation: spin 12s linear infinite;
            opacity: 0.3;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- テキスト情報 --- */
        .company-name {
            font-size: 22px;
            color: var(--accent-sub);
            margin-bottom: 5px;
            display: block;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            min-height: 1.2em;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-main);
            min-height: 1.2em;
        }

        .job-title {
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: var(--text-sub);
            font-weight: 600;
            margin-bottom: 25px;
            display: block;
            letter-spacing: 1px;
            min-height: 1.5em;
        }

        .bio {
            font-size: 14px;
            color: #555;
            line-height: 1.7;
            margin-bottom: 35px;
            text-align: left;
            padding: 15px;
            background: rgba(240, 245, 250, 0.7);
            border-left: 4px solid var(--accent-color);
            border-radius: 0 4px 4px 0;
            min-height: 4em;
        }

        /* --- リンクボタン --- */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: none; /* デフォルト非表示 */
            align-items: center;
            justify-content: center;
            padding: 14px;
            background: white;
            color: var(--text-main);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid #d1d9e6;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .link-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-sub);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
        }

        /* SAVE CONTACTボタン専用スタイル */
        .save-btn {
            display: flex; /* 最初から表示 */
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white !important;
            border: none;
            margin-bottom: 10px;
            animation: pulse-border 2s infinite;
            cursor: pointer;
        }
        .save-btn i { color: white !important; }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); }
        
        @keyframes pulse-border { 
            0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); } 
            70% { box-shadow: 0 0 0 10px rgba(0, 210, 255, 0); } 
            100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); } 
        }
        
        .link-btn i {
            margin-right: 10px;
            color: var(--accent-color);
            width: 20px;
            text-align: center;
        }

        #loading {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent-sub);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
            font-size: 14px;
        }

        /* =========================================================
           JARVIS風 HUDエフェクト
           ========================================================= */

        /* --- 起動シーケンス（ローディング画面） --- */
        #loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
            transition: opacity 0.6s ease;
        }
        #loading.hide { opacity: 0; pointer-events: none; }
        .boot-reactor { width: 130px; height: 130px; }
        .boot-reactor .r1 { animation: spin 3s linear infinite; }
        .boot-reactor .r2 { animation: spin 5s linear infinite reverse; }
        .boot-reactor .r3 { animation: spin 1.6s linear infinite; }
        .boot-reactor .core { animation: core-pulse 1.4s ease-in-out infinite; }
        .boot-reactor g, .hud-ring g { transform-origin: 100px 100px; }
        @keyframes core-pulse { 50% { opacity: 0.35; } }
        .boot-log {
            min-width: 260px;
            min-height: 6.5em;
            font-size: 12px;
            line-height: 1.6;
            text-align: left;
            color: var(--accent-sub);
        }
        .boot-log div::before { content: "> "; color: var(--accent-color); }
        .boot-log .ok { color: var(--accent-color); }

        /* --- プロフィール周りの回転HUDリング --- */
        .hud-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 180px; height: 180px;
            transform: translate(-50%, -50%) scale(0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 1;
            transition: transform 0.9s cubic-bezier(.2,.9,.3,1.2), opacity 0.6s ease;
        }
        .hud-on .hud-ring { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        .hud-ring .g1 { animation: spin 20s linear infinite; }
        .hud-ring .g2 { animation: spin 9s linear infinite reverse; }
        .hud-ring .g3 { animation: spin 5s linear infinite; }
        .hud-ring .g4 { animation: spin 14s linear infinite reverse; }

        /* --- カード出現時のスキャンライン --- */
        .scan-line {
            position: absolute;
            left: 0; right: 0; top: -10%;
            height: 80px;
            background: linear-gradient(to bottom, transparent, rgba(0, 210, 255, 0.18) 85%, rgba(0, 210, 255, 0.7));
            pointer-events: none;
            opacity: 0;
            z-index: 5;
        }
        .hud-on .scan-line { animation: scan 1.4s ease-out 0.1s forwards; }
        @keyframes scan {
            0% { top: -80px; opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- カード出現・コーナーのロックオン --- */
        .card-container { transform: scale(0.97); transition: opacity 0.5s ease, transform 0.6s ease; }
        .card-container.hud-on { transform: scale(1); }
        .hud-on .corner-deco { animation: corner-lock 0.7s ease-out; }
        @keyframes corner-lock {
            0% { width: 60px; height: 60px; opacity: 0; }
            60% { opacity: 1; }
            100% { width: 15px; height: 15px; opacity: 0.7; }
        }

        /* --- ステータス表示（カード上部の細い文字） --- */
        .hud-status {
            position: absolute;
            top: 16px; left: 0; right: 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--accent-sub);
            opacity: 0.55;
        }
        .hud-status .dot {
            display: inline-block;
            width: 6px; height: 6px;
            margin-right: 6px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 6px var(--accent-color);
            animation: core-pulse 1.4s ease-in-out infinite;
        }

        /* --- ボタンのホログラム光沢 --- */
        .link-btn::after {
            content: "";
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(0, 210, 255, 0.25), transparent);
            transform: skewX(-20deg);
            pointer-events: none;
        }
        .link-btn:hover::after { animation: shine 0.7s ease; }
        .save-btn::after { background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.45), transparent); animation: shine 3s ease-in-out infinite; }
        @keyframes shine { 0% { left: -60%; } 40%, 100% { left: 130%; } }

        /* 動きを減らす設定の端末では演出を止める */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
            .hud-ring { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div id="loading">
        <svg class="boot-reactor" viewBox="0 0 200 200" aria-hidden="true">
            <g class="r1"><circle cx="100" cy="100" r="90" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="140 50 40 50" /></g>
            <g class="r2"><circle cx="100" cy="100" r="74" fill="none" stroke="#3a7bd5" stroke-width="6" stroke-dasharray="2 6" opacity="0.6" /></g>
            <g class="r3"><circle cx="100" cy="100" r="58" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="60 304" /></g>
            <circle class="core" cx="100" cy="100" r="22" fill="rgba(0,210,255,0.25)" stroke="#00d2ff" stroke-width="2" />
        </svg>
        <div class="boot-log" id="bootLog"></div>
    </div>

    <div class="card-container" id="mainCard">
        <div class="corner-deco top-left"></div>
        <div class="corner-deco top-right"></div>
        <div class="corner-deco bottom-left"></div>
        <div class="corner-deco bottom-right"></div>
        <div class="scan-line"></div>
        <div class="hud-status"><span class="dot"></span>IDENTITY VERIFIED</div>

        <div class="profile-wrapper">
            <svg class="hud-ring" viewBox="0 0 200 200" aria-hidden="true">
                <g class="g1"><circle cx="100" cy="100" r="96" fill="none" stroke="#3a7bd5" stroke-width="3" stroke-dasharray="1 4" opacity="0.5" /></g>
                <g class="g2"><circle cx="100" cy="100" r="88" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="120 30 20 30 60 293" /></g>
                <g class="g3"><circle cx="100" cy="100" r="81" fill="none" stroke="#00d2ff" stroke-width="4" stroke-dasharray="40 214" opacity="0.8" /></g>
                <g class="g4"><circle cx="100" cy="100" r="75" fill="none" stroke="#3a7bd5" stroke-width="1" stroke-dasharray="200 271" opacity="0.6" /></g>
            </svg>
            <div class="spin-ring"></div>
            <img src="https://via.placeholder.com/150?text=USER" alt="Profile" class="profile-img" id="profileImg">
        </div>

        <span id="companyDisplay" class="company-name" data-value=""></span>
        <h1 id="nameDisplay" data-value=""></h1>
        <span id="jobDisplay" class="job-title" data-value=""></span>
        <p id="bioDisplay" class="bio" data-value=""></p>

        <div class="links-container">
            <a id="saveContactBtn" class="link-btn save-btn">
                <i class="fas fa-address-book"></i> 電話帳に追加
            </a>
            <a id="webLink" href="#" class="link-btn" target="_blank">
                <i class="fas fa-globe"></i> Website
            </a>
            <a id="twitterLink" href="#" class="link-btn" target="_blank">
                <i class="fab fa-twitter"></i> X (Twitter)
            </a>
            <a id="instaLink" href="#" class="link-btn" target="_blank">
                <i class="fab fa-instagram"></i> Instagram
            </a>
            <a id="githubLink" href="#" class="link-btn" target="_blank">
                <i class="fab fa-github"></i> GitHub
            </a>
            <a id="youtubeLink" href="#" class="link-btn" target="_blank">
                <i class="fab fa-youtube"></i> YouTube
            </a>
            <a id="lineLink" href="#" class="link-btn" target="_blank">
                <i class="fab fa-line"></i> LINE Add Friend
            </a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ★★★ Firebase Config (ご自身のものを使用) ★★★
        const firebaseConfig = {
            apiKey: "AIzaSyB4j_6qxxuLNOtaQPmvijHL4QPk_6I3vC0",
            authDomain: "digital-meishi.firebaseapp.com",
            projectId: "digital-meishi",
            storageBucket: "digital-meishi.firebasestorage.app",
            messagingSenderId: "380152343881",
            appId: "1:380152343881:web:fb3b6cdb50c4b12f7d7e98"
        };
        // ★★★ ここまで ★★★

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // デコード演出
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        function scrambleText(elementId, finalText) {
            return new Promise((resolve) => {
                const element = document.getElementById(elementId);
                let iterations = 0;
                if(!finalText) { element.innerHTML = ""; resolve(); return; }
                const interval = setInterval(() => {
                    element.innerText = finalText.split("").map((letter, index) => {
                        if(index < iterations) return finalText[index];
                        if(letter === " " || letter === "　") return letter;
                        return letters[Math.floor(Math.random() * letters.length)];
                    }).join("");
                    if(iterations >= finalText.length) { clearInterval(interval); resolve(); }
                    iterations += 1 / 2;
                }, 30);
            });
        }

        // JARVIS風 起動ログ演出
        const bootLines = [
            "INITIALIZING INTERFACE...",
            "CONNECTING TO DATABASE...",
            "DECRYPTING IDENTITY DATA..."
        ];
        function runBootSequence() {
            const log = document.getElementById('bootLog');
            return new Promise((resolve) => {
                let i = 0;
                const next = () => {
                    if (i >= bootLines.length) { resolve(); return; }
                    const line = document.createElement('div');
                    line.innerText = bootLines[i];
                    log.appendChild(line);
                    i++;
                    setTimeout(next, 380);
                };
                next();
            });
        }
        function showBootError(message) {
            const log = document.getElementById('bootLog');
            const line = document.createElement('div');
            line.innerText = message;
            line.style.color = "red";
            log.appendChild(line);
        }

        // リンクは http/https だけ許可（javascript: などで不正な動作をさせないため）
        function safeUrl(value) {
            try {
                const url = new URL(String(value || '').trim());
                return (url.protocol === 'https:' || url.protocol === 'http:') ? url.href : '';
            } catch (e) {
                return '';
            }
        }

        // プロフィール画像は保存時に作る JPEG/PNG のデータか https の画像だけ表示する
        function safeImageSrc(value) {
            const s = String(value || '');
            if (/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(s)) return s;
            return safeUrl(s).startsWith('https:') ? s : '';
        }

        // vCard用に特殊文字をエスケープ（改行・カンマ・セミコロンで項目が崩れないように）
        function vcardEscape(value) {
            return String(value || '')
                .replace(/\\/g, '\\\\')
                .replace(/\r?\n/g, '\\n')
                .replace(/,/g, '\\,')
                .replace(/;/g, '\\;');
        }

        // 電話帳登録用 vCard を作成
        // N(氏名)を必ず入れることで、iPhone等で「会社名」が名前欄に表示される問題を防ぐ
        function buildVCard(data) {
            const fullName = (data.name || '').trim();
            const parts = fullName.split(/[\s\u3000]+/).filter(Boolean);
            // 「山田 太郎」のように スペース区切りなら 姓・名 に分ける
            const familyName = parts.length > 1 ? parts[0] : fullName;
            const givenName = parts.length > 1 ? parts.slice(1).join(' ') : '';

            const lines = [
                'BEGIN:VCARD',
                'VERSION:3.0',
                `N:${vcardEscape(familyName)};${vcardEscape(givenName)};;;`,
                `FN:${vcardEscape(fullName)}`
            ];
            if (data.company) lines.push(`ORG:${vcardEscape(data.company)}`);
            if (data.job) lines.push(`TITLE:${vcardEscape(data.job)}`);
            if (data.phone) lines.push(`TEL;TYPE=CELL:${data.phone}`);
            if (data.email) lines.push(`EMAIL;TYPE=WORK:${data.email}`);
            if (data.website) lines.push(`URL:${data.website}`);
            if (data.bio) lines.push(`NOTE:${vcardEscape(data.bio)}`);
            lines.push('END:VCARD');
            return lines.join('\r\n');
        }

        async function loadCard() {
            const params = new URLSearchParams(window.location.search);
            const cardId = params.get('id');

            if (!cardId) {
                showBootError("ERROR: ID REQUIRED");
                return;
            }

            try {
                const docRef = doc(db, "cards", cardId);
                // 起動演出とデータ取得を同時に進める
                const [docSnap] = await Promise.all([getDoc(docRef), runBootSequence()]);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    const okLine = document.createElement('div');
                    okLine.className = 'ok';
                    okLine.innerText = "BIOMETRIC MATCH CONFIRMED";
                    document.getElementById('bootLog').appendChild(okLine);
                    await new Promise(r => setTimeout(r, 350));

                    const loading = document.getElementById('loading');
                    loading.classList.add('hide');
                    setTimeout(() => { loading.style.display = 'none'; }, 600);
                    const mainCard = document.getElementById('mainCard');
                    mainCard.style.opacity = 1;
                    mainCard.classList.add('hud-on');

                    // 基本情報の表示
                    await scrambleText('companyDisplay', data.company || "CORPORATION");
                    await scrambleText('nameDisplay', data.name || "NO NAME");
                    await scrambleText('jobDisplay', data.job || "");
                    document.getElementById('bioDisplay').innerText = data.bio || "";

                    // ---------------------------------------------------------
                    // ★★★ 追加：プロフィール画像を表示する処理 ★★★
                    // ---------------------------------------------------------
                    if(safeImageSrc(data.photoUrl)) {
                        document.getElementById('profileImg').src = safeImageSrc(data.photoUrl);
                    } else {
                        // 画像が設定されていない場合はデフォルト画像
                        document.getElementById('profileImg').src = "https://via.placeholder.com/150?text=USER";
                    }
                    // ---------------------------------------------------------

                    // 電話帳に追加 (SAVE CONTACT) 機能
                    const saveBtn = document.getElementById('saveContactBtn');
                    saveBtn.onclick = () => {
                        const vcard = buildVCard(data);
                        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = (data.name || 'contact') + '.vcf';
                        link.click();
                    };

                    // 各SNSリンクの表示判定
                    if(safeUrl(data.website)) {
                        const el = document.getElementById('webLink');
                        el.href = safeUrl(data.website);
                        el.style.display = "flex";
                    }
                    if(data.twitter) {
                        const el = document.getElementById('twitterLink');
                        el.href = "https://twitter.com/" + data.twitter.replace('@','');
                        el.style.display = "flex";
                    }
                    if(data.instagram) {
                        const el = document.getElementById('instaLink');
                        el.href = "https://instagram.com/" + data.instagram.replace('@','');
                        el.style.display = "flex";
                    }
                    if(data.github) {
                        const el = document.getElementById('githubLink');
                        el.href = "https://github.com/" + data.github;
                        el.style.display = "flex";
                    }
                    if(safeUrl(data.youtube)) {
                        const el = document.getElementById('youtubeLink');
                        el.href = safeUrl(data.youtube);
                        el.style.display = "flex";
                    }
                    if(safeUrl(data.line)) {
                        const el = document.getElementById('lineLink');
                        el.href = safeUrl(data.line);
                        el.style.display = "flex";
                    }

                } else {
                    showBootError("DATA NOT FOUND");
                }
            } catch (e) {
                showBootError("SYSTEM ERROR: " + e.message);
            }
        }

        loadCard();
    </script>
</body>
</html>

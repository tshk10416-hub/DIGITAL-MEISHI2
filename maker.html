<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名刺データ管理（Admin）</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background: #f0f2f5; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 30px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .section-title { font-size: 18px; font-weight: bold; color: #2c3e50; border-bottom: 2px solid #e0e0e0; padding-bottom: 10px; margin-bottom: 20px; display: flex; align-items: center; }
        .section-title i { margin-right: 10px; color: #00d2ff; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #555; display: flex; align-items: center; }
        input[type="text"], input[type="url"], input[type="email"], input[type="tel"], textarea, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; background: #f9f9f9; }
        input:focus, textarea:focus { border-color: #00d2ff; background: #fff; outline: none; }
        
        /* 画像アップロード用のスタイル */
        .photo-upload-area { display: flex; align-items: center; gap: 15px; background: #f9f9f9; padding: 15px; border-radius: 8px; border: 1px dashed #ccc; }
        .photo-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid #00d2ff; background: #fff; flex-shrink: 0; }
        .file-input-wrapper input[type="file"] { font-size: 14px; padding: 5px; background: none; border: none; width: 100%; }
        
        .sns-item { display: flex; align-items: center; background: #f8f9fa; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .sns-icon { width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: #555; flex-shrink: 0; }
        .sns-input-wrapper { flex-grow: 1; }
        .sns-label { font-size: 12px; color: #888; margin-bottom: 4px; display: block; }
        button { width: 100%; padding: 15px; background: #00d2ff; color: white; border: none; font-size: 16px; margin-top: 10px; cursor: pointer; border-radius: 8px; font-weight: bold; transition: 0.2s; box-shadow: 0 4px 10px rgba(0, 210, 255, 0.3); }
        button:hover { background: #00b0d4; transform: translateY(-2px); }
        button.load-btn { background: #2c3e50; box-shadow: none; margin-top: 5px; font-size: 14px; padding: 10px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; display: none; }
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
        .auth-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .auth-bar p { margin: 0; font-size: 14px; }
        .auth-bar button { width: auto; margin-top: 0; padding: 10px 18px; font-size: 14px; }
        button.logout-btn { background: #95a5a6; box-shadow: none; }
        #editor[hidden] { display: none; }
    </style>
</head>
<body>
    <h2>🛠️ 名刺データ管理</h2>

    <!-- 編集は管理者のGoogleアカウントでログインした時だけ可能（Firestoreのルールでも同じ制限をかけている） -->
    <div class="card auth-bar">
        <p id="authStatus">ログイン状態を確認中...</p>
        <button id="loginBtn" onclick="login()" hidden><i class="fab fa-google"></i> Googleでログイン</button>
        <button id="logoutBtn" onclick="logout()" class="logout-btn" hidden>ログアウト</button>
    </div>

    <div id="editor" hidden>
    <div class="card">
        <div class="section-title"><i class="fas fa-id-card"></i> 編集する名刺</div>
        <!-- ログインすると名刺の一覧を読み込み、前回編集した名刺（なければ先頭）を自動で表示する -->
        <select id="cardSelect" onchange="selectCard(this.value)"><option>読み込み中...</option></select>
        <div id="newIdArea" class="form-group" style="margin-top:15px;" hidden>
            <label>新しいカードID (英数字)</label>
            <input type="text" id="cardId" placeholder="例: myself01">
        </div>
    </div>

    <div class="card">
        <div class="section-title"><i class="fas fa-user"></i> 基本情報</div>
        
        <div class="form-group">
            <label>📸 プロフィール画像</label>
            <div class="photo-upload-area">
                <img id="photoPreview" class="photo-preview" src="https://via.placeholder.com/150?text=NO+IMG" alt="Preview">
                <div class="file-input-wrapper">
                    <input type="file" id="photoUpload" accept="image/*">
                    <p style="font-size:12px; color:#888; margin:5px 0 0 0;">※スマホのフォルダから写真を選べます。<br>自動で軽量化されてデータベースに保存されます。</p>
                </div>
            </div>
        </div>

        <div class="form-group"><label>会社名 (Company)</label><input type="text" id="company" placeholder="例: 株式会社〇〇"></div>
        <div class="form-group"><label>お名前 (Name)</label><input type="text" id="name" placeholder="例: 山田 太郎"></div>
        <div class="form-group"><label>肩書き (Job Title)</label><input type="text" id="job" placeholder="例: 代表取締役 / エンジニア"></div>
        <div class="form-group"><label>📧 メールアドレス (電話帳登録ボタンで相手に渡ります)</label><input type="email" id="email" placeholder="例: contact@example.com"></div>
        <div class="form-group"><label>📞 電話番号 (電話帳登録ボタンで相手に渡ります)</label><input type="tel" id="phone" placeholder="例: 090-1234-5678"></div>
        <div class="form-group"><label>自己紹介 (Bio)</label><textarea id="bio" rows="3" placeholder="短い自己紹介文..."></textarea></div>
        <div class="form-group"><label><i class="fas fa-globe" style="margin-right:5px;"></i> Webサイト URL</label><input type="url" id="website" placeholder="https://your-portfolio.com"></div>
    </div>

    <div class="card">
        <div class="section-title"><i class="fas fa-share-alt"></i> SNSリンク設定</div>
        <p style="font-size:12px; color:#666; margin-bottom:15px;">※表示したいSNSのみ入力してください。空欄の場合はアイコンが表示されません。</p>
        
        <div class="sns-item"><div class="sns-icon" style="color:#000;"><i class="fab fa-twitter"></i></div><div class="sns-input-wrapper"><span class="sns-label">X (Twitter) ID</span><input type="text" id="twitter" placeholder="@マークなしで入力"></div></div>
        <div class="sns-item"><div class="sns-icon" style="color:#E1306C;"><i class="fab fa-instagram"></i></div><div class="sns-input-wrapper"><span class="sns-label">Instagram ID</span><input type="text" id="instagram" placeholder="ユーザーID"></div></div>
        <div class="sns-item"><div class="sns-icon" style="color:#333;"><i class="fab fa-github"></i></div><div class="sns-input-wrapper"><span class="sns-label">GitHub ID</span><input type="text" id="github" placeholder="ユーザーID"></div></div>
        <div class="sns-item"><div class="sns-icon" style="color:#FF0000;"><i class="fab fa-youtube"></i></div><div class="sns-input-wrapper"><span class="sns-label">YouTube URL</span><input type="text" id="youtube" placeholder="https://youtube.com/..."></div></div>
        <div class="sns-item"><div class="sns-icon" style="color:#00B900;"><i class="fab fa-line"></i></div><div class="sns-input-wrapper"><span class="sns-label">LINE URL</span><input type="text" id="line" placeholder="https://line.me/..."></div></div>
        
        <button onclick="saveData()">💾 保存して更新する</button>
        <div id="statusMessage" class="status"></div>
    </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // 編集できるのはこのアカウントだけ（Firestoreのセキュリティルールにも同じアドレスを設定済み）
        const ADMIN_EMAILS = ["tshk.10416@gmail.com"];
        const CARD_ID_PATTERN = /^[A-Za-z0-9_-]{1,40}$/;
        const NEW_CARD = "__new__";
        const LAST_CARD_KEY = "meishiMaker_lastCardId";
        const NO_IMAGE = "https://via.placeholder.com/150?text=NO+IMG";
        const FIELDS = ['name', 'job', 'company', 'email', 'phone', 'bio', 'website', 'twitter', 'instagram', 'github', 'youtube', 'line'];

        const firebaseConfig = {
            apiKey: "AIzaSyB4j_6qxxuLNOtaQPmvijHL4QPk_6I3vC0",
            authDomain: "digital-meishi.firebaseapp.com",
            projectId: "digital-meishi",
            storageBucket: "digital-meishi.firebasestorage.app",
            messagingSenderId: "380152343881",
            appId: "1:380152343881:web:fb3b6cdb50c4b12f7d7e98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const isAdmin = (user) => !!user && user.emailVerified && ADMIN_EMAILS.includes(user.email);

        onAuthStateChanged(auth, (user) => {
            const statusEl = document.getElementById('authStatus');
            document.getElementById('loginBtn').hidden = !!user;
            document.getElementById('logoutBtn').hidden = !user;
            document.getElementById('editor').hidden = !isAdmin(user);
            if (!user) {
                statusEl.innerText = "名刺を編集するにはログインしてください";
            } else if (isAdmin(user)) {
                statusEl.innerText = "✅ " + user.email + " でログイン中";
                loadCardList();
            } else {
                statusEl.innerText = "⚠️ " + user.email + " には編集権限がありません";
            }
        });

        window.login = async function() {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                // ポップアップがブロックされる端末ではページ移動式のログインに切り替える
                if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') {
                    await signInWithRedirect(auth, provider);
                } else if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
                    alert("ログインに失敗しました: " + e.message);
                }
            }
        }

        window.logout = function() { signOut(auth); fillForm({}); }

        let currentPhotoDataUrl = "";

        function fillForm(data) {
            currentPhotoDataUrl = data.photoUrl || "";
            document.getElementById('photoPreview').src = currentPhotoDataUrl || NO_IMAGE;
            FIELDS.forEach(f => { document.getElementById(f).value = data[f] || ""; });
        }

        // ログイン後に名刺の一覧を読み込み、前回編集した名刺（なければ先頭）を表示する
        async function loadCardList(selectId) {
            const sel = document.getElementById('cardSelect');
            try {
                const snap = await getDocs(collection(db, "cards"));
                const ids = snap.docs.map(d => d.id).sort();
                sel.innerHTML = "";
                ids.forEach(id => sel.add(new Option(id, id)));
                sel.add(new Option("＋ 新しい名刺を作る", NEW_CARD));

                let last = null;
                try { last = localStorage.getItem(LAST_CARD_KEY); } catch (e) {}
                const pick = [selectId, last].find(id => id && ids.includes(id)) || ids[0] || NEW_CARD;
                sel.value = pick;
                await selectCard(pick);
            } catch (e) {
                sel.innerHTML = "";
                sel.add(new Option("読み込みに失敗しました", ""));
                alert("名刺の一覧を読み込めませんでした: " + e.message);
            }
        }

        window.selectCard = async function(id) {
            const isNew = id === NEW_CARD;
            const idInput = document.getElementById('cardId');
            document.getElementById('newIdArea').hidden = !isNew;
            document.getElementById('statusMessage').style.display = 'none';
            if (isNew) {
                idInput.value = "";
                fillForm({});
                return;
            }
            idInput.value = id;
            try { localStorage.setItem(LAST_CARD_KEY, id); } catch (e) {}
            const docSnap = await getDoc(doc(db, "cards", id));
            fillForm(docSnap.exists() ? docSnap.data() : {});
        }

        document.getElementById('photoUpload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 300;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_SIZE) {
                            height *= MAX_SIZE / width;
                            width = MAX_SIZE;
                        }
                    } else {
                        if (height > MAX_SIZE) {
                            width *= MAX_SIZE / height;
                            height = MAX_SIZE;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    currentPhotoDataUrl = dataUrl;
                    document.getElementById('photoPreview').src = dataUrl;
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        window.saveData = async function() {
            const cardId = document.getElementById('cardId').value;
            const statusEl = document.getElementById('statusMessage');
            if(!cardId) { alert("IDを入力してください"); return; }
            if(!CARD_ID_PATTERN.test(cardId)) { alert("IDは半角英数字・ハイフン・アンダーバーの40文字以内で入力してください"); return; }
            if(!isAdmin(auth.currentUser)) { alert("編集権限のあるアカウントでログインしてください"); return; }
            if (document.getElementById('cardSelect').value === NEW_CARD) {
                const exists = [...document.getElementById('cardSelect').options].some(o => o.value === cardId);
                if (exists && !confirm("ID「" + cardId + "」の名刺はすでにあります。上書きしますか？")) return;
            }

            statusEl.innerText = "データを保存中...";
            statusEl.style.display = 'block'; 
            statusEl.className = 'status';

            try {
                await setDoc(doc(db, "cards", cardId), {
                    photoUrl: currentPhotoDataUrl, 
                    name: document.getElementById('name').value,
                    job: document.getElementById('job').value,
                    company: document.getElementById('company').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    bio: document.getElementById('bio').value,
                    website: document.getElementById('website').value,
                    twitter: document.getElementById('twitter').value,
                    instagram: document.getElementById('instagram').value,
                    github: document.getElementById('github').value,
                    youtube: document.getElementById('youtube').value,
                    line: document.getElementById('line').value
                });
                
                statusEl.innerText = "✅ 保存完了！即座に反映されました。";
                statusEl.classList.add('success');
                // 新しく作った名刺は一覧に追加して選択状態にする
                if (document.getElementById('cardSelect').value === NEW_CARD) {
                    await loadCardList(cardId);
                    statusEl.style.display = 'block';
                }
            } catch (e) { 
                statusEl.innerText = "❌ エラー: " + e.message; 
                statusEl.classList.add('error'); 
            }
        }

    </script>
</body>
</html>
